# electron-builder 打包配置
appId: com.yungumax.dydown
productName: DYdown
copyright: Copyright © 2026 yungumax

directories:
  output: dist
  buildResources: build

# 直接使用本机 node_modules 里已下载好的 Electron，避免重复下载
electronDist: node_modules/electron/dist

files:
  - main.cjs
  - extract-ids.js
  - hook-api.js
  - mix-cards.js
  - preload.cjs
  - server.cjs
  - dist-web/**/*
  - package.json
  - "!scripts/**"
  - "!**/*.map"

# 自动更新：从 GitHub Releases 拉取 latest.yml
publish:
  provider: github
  owner: yungumax
  repo: DYdown
  # 直接发布正式 Release（默认是草稿，electron-updater 看不到草案）
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# oneClick 静默安装：electron-updater 才能应用内升级
nsis:
  # 标准安装向导（非一键静默）：欢迎页 → 选择安装位置 → 安装进度 → 完成页；
  # 自动更新（electron-updater）对引导式安装器同样支持，升级时静默执行
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DYdown
  uninstallDisplayName: DYdown
  # 完成页可勾选"运行 DYdown"
  runAfterFinish: true
  # 卸载时询问是否删除用户数据（登录状态/下载清单）——由自定义脚本接管询问，
  # 所以这里保持 false（true 会由框架无条件删除、不给用户选择）
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: DYdown-Setup-${version}.${ext}
